name: Import prepared Repose Residence snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-prepared-site.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Restore and verify all prepared website files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, time, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path, PurePosixPath
          
          def blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          
          def restore(item):
              relative=PurePosixPath(item['path'])
              if relative.is_absolute() or '..' in relative.parts or '.git' in relative.parts:
                  raise ValueError('Invalid destination')
              target=Path(item['path'])
              if target.is_file() and blob_sha(target.read_bytes())==item['sha']:
                  return
              if 'base64' in item:
                  data=base64.b64decode(item['base64'])
              else:
                  if not item['url'].startswith('https://reposeresidence.com/'):
                      raise ValueError('Unexpected asset origin')
                  for attempt in range(4):
                      try:
                          request=urllib.request.Request(item['url'],headers={'User-Agent':'Mozilla/5.0'})
                          with urllib.request.urlopen(request, timeout=90) as response:
                              data=response.read()
                          break
                      except Exception:
                          if attempt==3: raise
                          time.sleep(2*(attempt+1))
              if blob_sha(data)!=item['sha'] and target.suffix in {'.js','.css','.json','.html'}:
                  data=data.replace(b'\r\n',b'\n')
              if blob_sha(data)!=item['sha']:
                  raise ValueError('Asset does not match the prepared snapshot: '+item['path'])
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          
